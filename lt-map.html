function u8(s){return Uint8Array.from(atob(s),function(c){return c.charCodeAt(0);});}
async function tryKey(e,pw){
  var k0=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  var k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u8(e.s),iterations:B.n,hash:'SHA-256'},k0,{name:'AES-GCM',length:256},false,['decrypt']);
  return await crypto.subtle.decrypt({name:'AES-GCM',iv:u8(e.i)},k,u8(e.w));}
function count(path){ if(!GC||!path) return;

async function open_(raw){

  var order=idx!==null&&B.k[idx]?[idx]:B.k.map(function(_,i){return i;});
  for(var j=0;j<order.length;j++){
    try{
      var cek=await tryKey(B.k[order[j]],pw);
      var key=await crypto.subtle.importKey('raw',cek,'AES-GCM',false,['decrypt']);
      var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:u8(B.i)},key,u8(B.c));

      var html=new TextDecoder().decode(pt);
      document.open();document.write(html);document.close();return;
    }catch(e){}
  }

}
