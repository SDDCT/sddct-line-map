function u8(s){return Uint8Array.from(atob(s),function(c){return c.charCodeAt(0);});}
async function open_(pw){
  var m=document.getElementById('m');m.textContent='Opening\u2026';
  try{
    var k0=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
    var k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u8(B.s),iterations:B.n,hash:'SHA-256'},k0,{name:'AES-GCM',length:256},false,['decrypt']);
    var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:u8(B.i)},k,u8(B.c));
    var html=new TextDecoder().decode(pt);
    if(location.hash) history.replaceState(null,'',location.pathname);
    document.open();document.write(html);document.close();
  }catch(e){m.textContent='That code did not work. Check it and try again.';}
}
document.getElementById('go').onclick=function(){open_(document.getElementById('pw').value.trim());};
document.getElementById('pw').onkeydown=function(e){if(e.key==='Enter')open_(this.value.trim());};
